name: Signaling Service CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "infra/nat-traversal/**"
      - ".github/workflows/signaling.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/nat-traversal/**"
      - ".github/workflows/signaling.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run signaling service tests
        run: node --test infra/nat-traversal/signaling/server.test.mjs
